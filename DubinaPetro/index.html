<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" >
    <section class="game-card">
      <header class="game-header">
        <!-- таймер та кнопка нової гри -->
        <div class="status-panel" aria-label="Таймер">
          <span class="status-label">Час</span>
          <span class="status-value">042</span> 
        </div>

        <button class="start-button" type="button" >
          <img class="face" src="assets/verity.png" alt="">
        </button>

        <!-- міни  -->
        <div class="status-panel" >
          <span class="status-label">Міни</span>
          <span class="status-value">010</span>
        </div>
      </header>

      <h1 id="game-title" class="game-title">Сапер</h1>

      <div class="board">
        <!-- числові клітинки -->
        <button class="cell cell--open cell--one">1</button>
        <button class="cell cell--open cell--two">2</button>
        <button class="cell cell--open cell--three">3</button>
        <button class="cell cell--open cell--four">4</button>
        <button class="cell cell--open cell--five">5</button>
        <button class="cell cell--open cell--six">6</button>
        <button class="cell cell--open cell--seven">7</button>
        <button class="cell cell--open cell--eight">8</button>

        <!-- стани клітинок -->
        <button class="cell cell--closed"></button>
        <button class="cell cell--flag"></button>
        <button class="cell cell--question">?</button>
        <button class="cell cell--open cell--mine"></button>
        <button class="cell cell--mine cell--exploded"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>

        <!-- закрите поле до початку гри. 6 рядів по 8 клітинок -->
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>

        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>

        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>

        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>

        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>

        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        <button class="cell cell--closed"></button>
        
      </div>
    </section>
  </main>
</body>
</html>
