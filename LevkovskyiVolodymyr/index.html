<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/game.js" defer></script>
</head>
<body>
<header>
  <div class="btn-container">
    <button class="start-btn">Start</button>
    <button class="stop-btn">Stop</button>
  </div>

    <p class="flags-count">0 flags</p>

</header>
<main class="game">
  <table class="board">
    <tbody>

      <th class="column closed"></th>

      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
    </tr>
    <tr class="raw">
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>

    <tr class="raw">

      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
    </tr>
    <tr class="raw">
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
    </tr>
    <tr class="raw">
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
    </tr>
    <tr class="raw">
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
      <th class="column closed"></th>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
